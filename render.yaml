# Render blueprint — deploy "Agbota Segun" with one click.
# How to use: push this repo to GitHub, then in Render choose
# "Blueprint" → paste the repo URL. It creates the web service and
# database automatically.
#
# Free tier notes:
#  - Free web services sleep after 15 min of inactivity (wakes on request).
#  - Free Postgres databases expire after 30 days — for a permanent launch
#    use a free Neon or Supabase database and set DATABASE_URL yourself
#    (then remove the `databases:` block below).
services:
  - type: web
    name: agbota-segun
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: agbotasegun.outreach@gmail.com
      - key: ADMIN_PASSWORD
        value: ecomexpert
      - key: BTC_ADDRESS
        value: ""
      - key: PAYPAL_INSTRUCTIONS
        value: "PayPal payments are arranged personally through Chat after you place your order."
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: agbota-segun-db
          property: connectionString
    disk:
      name: agbota-segun-data
      mountPath: /app/data
      sizeGB: 1

databases:
  - name: agbota-segun-db
    plan: free
